name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history — scripts/build-info.js counts commits for the
          # package.json version electron-updater compares; a shallow clone
          # would make every build report the same count (1).
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled Chromium
        run: |
          if [ ! -d chromium-bundle/chrome ]; then
            echo "::error::chromium-bundle/chrome missing — puppeteer postinstall must have failed"
            exit 1
          fi
          ls chromium-bundle/chrome

      - name: Verify bundled yt-dlp
        run: |
          if [ ! -f yt-dlp-bundle/yt-dlp_macos ]; then
            echo "::error::yt-dlp-bundle/yt-dlp_macos missing — fetch-ytdlp postinstall must have failed"
            exit 1
          fi
          ls -la yt-dlp-bundle

      - name: Verify bundled fpcalc
        run: |
          if [ ! -f fpcalc-bundle/fpcalc ]; then
            echo "::error::fpcalc-bundle/fpcalc missing — fetch-fpcalc postinstall must have failed"
            exit 1
          fi
          ls -la fpcalc-bundle

      - name: Verify bundled ffmpeg
        run: |
          if [ ! -f node_modules/ffmpeg-static/ffmpeg ]; then
            echo "::error::ffmpeg-static binary missing — npm ci postinstall must have failed"
            exit 1
          fi
          ls -la node_modules/ffmpeg-static

      - name: Build macOS artifacts
        env:
          # Build unsigned: users will need to bypass Gatekeeper manually
          # (right-click → Open, or `xattr -d com.apple.quarantine /Applications/Audex.app`).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # --publish never: electron-builder otherwise auto-publishes when a git tag
        # is present and demands GH_TOKEN. We attach artifacts in the next step.
        run: npm run dist -- --mac --publish never

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history — scripts/build-info.js counts commits for the
          # package.json version electron-updater compares; a shallow clone
          # would make every build report the same count (1).
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled Chromium
        shell: bash
        run: |
          if [ ! -d chromium-bundle/chrome ]; then
            echo "::error::chromium-bundle/chrome missing — puppeteer postinstall must have failed"
            exit 1
          fi
          ls chromium-bundle/chrome

      - name: Verify bundled yt-dlp
        shell: bash
        run: |
          if [ ! -f yt-dlp-bundle/yt-dlp.exe ]; then
            echo "::error::yt-dlp-bundle/yt-dlp.exe missing — fetch-ytdlp postinstall must have failed"
            exit 1
          fi
          ls -la yt-dlp-bundle

      - name: Verify bundled fpcalc
        shell: bash
        run: |
          if [ ! -f fpcalc-bundle/fpcalc.exe ]; then
            echo "::error::fpcalc-bundle/fpcalc.exe missing — fetch-fpcalc postinstall must have failed"
            exit 1
          fi
          ls -la fpcalc-bundle

      - name: Verify bundled ffmpeg
        shell: bash
        run: |
          if [ ! -f node_modules/ffmpeg-static/ffmpeg.exe ]; then
            echo "::error::ffmpeg-static binary missing — npm ci postinstall must have failed"
            exit 1
          fi
          ls -la node_modules/ffmpeg-static

      - name: Build Windows artifacts
        # Build unsigned: SmartScreen will warn on first launch until the binary
        # gains reputation. Add a code-signing cert later via CSC_LINK/CSC_KEY_PASSWORD.
        run: npm run dist -- --win --publish never

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/*.zip
            release/*.yml

  # Paused for now — the mobile/ Capacitor app isn't going out with releases
  # until it's further along. Flip this back to `true` (or drop the `if:`
  # entirely) to resume attaching it.
  build-android:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history — versionCode is the commit count (see below), same
          # reasoning as scripts/build-info.js's commit count for desktop.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync web assets and Capacitor
        working-directory: mobile
        run: |
          node sync-assets.js
          npx cap sync android

      # versionCode has to strictly increase for UpdaterPlugin's install-over-
      # existing to be accepted as an update rather than a downgrade — commit
      # count already fills that role for desktop's package.json (see
      # scripts/build-info.js), reused here for the same reason. versionName
      # is the exact tag (v-<hash>) so bridge.js's checkForUpdate() can just
      # string-compare it against GitHub's "latest release" tag.
      - name: Compute version
        id: version
        run: echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PaudexVersionCode=${{ steps.version.outputs.code }} \
            -PaudexVersionName=${{ github.ref_name }}

      - name: Rename APK for release
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "audex-android-${{ github.ref_name }}.apk"

      - name: Attach artifact to release
        uses: softprops/action-gh-release@v3
        with:
          files: audex-android-${{ github.ref_name }}.apk

  # zhotheone/PixelPlayer is a separate repo (a fork of PixelPlayerHQ/PixelPlayer
  # with an added Audex LAN source, see README's Devices section) — it has its
  # own commit history, so there's no meaningful ref of ours to pin it to; this
  # just builds whatever's on its default branch at release time and ships it
  # alongside audex-player's own artifacts. Toolchain steps and the Gradle
  # invocation are copied from PixelPlayer's own .github/workflows/phone-debug.yml
  # rather than reinvented — notably no separate Android SDK setup step: their
  # CI relies on ubuntu-latest's preinstalled SDK + AGP's own auto-download for
  # anything newer (PixelPlayer's compileSdk tends to track new API levels
  # ahead of what's preinstalled), and `-Ppixelplay.enableAbiSplits=true` is
  # required to get the arm64-v8a/armeabi-v7a split APKs.
  build-pixelplayer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PixelPlayer fork
        uses: actions/checkout@v6
        with:
          repository: zhotheone/PixelPlayer
          path: PixelPlayer

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build PixelPlayer debug APK
        working-directory: PixelPlayer
        run: gradle :app:assembleDebug -Ppixelplay.enableAbiSplits=true

      - name: Rename APKs for release
        working-directory: PixelPlayer/app/build/outputs/apk/debug
        run: |
          for f in *.apk; do
            mv "$f" "pixelplayer-${{ github.ref_name }}-$f"
          done

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          files: PixelPlayer/app/build/outputs/apk/debug/*.apk